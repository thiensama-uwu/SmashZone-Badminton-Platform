<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#d90b38" />
    </linearGradient>
    <linearGradient id="shuttleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f2f5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Badminton Court Grid Lines (Subtle) -->
  <rect x="20" y="20" width="80" height="80" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  <line x1="60" y1="20" x2="60" y2="100" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="20" y1="60" x2="100" y2="60" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Dynamic Speed Arc / Swoosh -->
  <path d="M 28 84 Q 56 36 88 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Modern Badminton Shuttlecock -->
  <!-- Feathers -->
  <path d="M 44 48 L 76 48 L 70 72 L 50 72 Z" fill="url(#shuttleGrad)" />
  <line x1="52" y1="48" x2="55" y2="72" stroke="#ff385c" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="60" y1="48" x2="60" y2="72" stroke="#ff385c" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="68" y1="48" x2="65" y2="72" stroke="#ff385c" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Feather binding band -->
  <rect x="47" y="60" width="26" height="3" rx="1.5" fill="#ff385c" />
  
  <!-- Shuttlecock Cork / Head -->
  <path d="M 50 72 C 50 72 50 86 60 86 C 70 86 70 72 70 72 Z" fill="#ffffff" />
  <ellipse cx="60" cy="74" rx="9" ry="3" fill="#ff385c" />
</svg>