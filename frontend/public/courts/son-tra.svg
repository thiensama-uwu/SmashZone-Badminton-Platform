<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="rauschPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#bgGrad4)" rx="16" />

  <!-- Sơn Trà Coastal Mountain & Wave Crest -->
  <path d="M 170 250 Q 230 160 300 130 Q 370 160 430 250 Z" fill="#064e3b" opacity="0.6" stroke="url(#emeraldWave)" stroke-width="2" />
  <path d="M 210 250 Q 260 180 300 155 Q 340 180 390 250 Z" fill="#022c22" opacity="0.8" />

  <!-- Water / Sea Breeze Swoosh -->
  <path d="M 180 270 Q 300 230 420 270" fill="none" stroke="url(#emeraldWave)" stroke-width="3" stroke-linecap="round" />
  <path d="M 200 285 Q 300 250 400 285" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Flying Badminton Shuttlecock with Rausch Cork -->
  <g>
    <path d="M 284 140 L 316 140 L 309 180 L 291 180 Z" fill="#ffffff" />
    <line x1="294" y1="140" x2="296" y2="180" stroke="#065f46" stroke-width="1.5" />
    <line x1="300" y1="140" x2="300" y2="180" stroke="#065f46" stroke-width="1.5" />
    <line x1="306" y1="140" x2="304" y2="180" stroke="#065f46" stroke-width="1.5" />
    <path d="M 291 180 C 291 180 291 198 300 198 C 309 198 309 180 309 180 Z" fill="url(#rauschPop)" />
    <circle cx="300" cy="190" r="3" fill="#ffffff" />
  </g>

  <!-- Name Badge -->
  <rect x="160" y="295" width="280" height="40" rx="20" fill="url(#rauschPop)" />
  <text x="300" y="321" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    SÂN CẦU LÔNG SƠN TRÀ
  </text>

  <!-- Location Label -->
  <text x="300" y="358" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="3">
    QUẬN SƠN TRÀ • ĐÀ NẴNG
  </text>
  <text x="300" y="376" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    KHÔNG GIAN THOÁNG MÁT • MẶT THẢM CHỐNG LÓA
  </text>
</svg>