<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rauschGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#e00b41" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#bgGrad3)" rx="16" />

  <!-- Hexagonal Framework -->
  <polygon points="300,55 440,135 440,295 300,375 160,295 160,135" 
           fill="#1e1e38" stroke="url(#rauschGrad)" stroke-width="4" />
  <polygon points="300,75 420,145 420,285 300,355 180,285 180,145" 
           fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Speed Wings / Crest -->
  <path d="M 200 200 L 250 160 L 250 220 Z" fill="url(#orangeGrad)" opacity="0.8" />
  <path d="M 400 200 L 350 160 L 350 220 Z" fill="url(#orangeGrad)" opacity="0.8" />

  <!-- Badminton Racket Silhouette in Center -->
  <ellipse cx="300" cy="180" rx="42" ry="52" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
  <path d="M 270 180 L 330 180 M 300 140 L 300 220 M 280 155 L 320 205 M 280 205 L 320 155" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Bold Shuttlecock -->
  <path d="M 285 155 L 315 155 L 308 190 L 292 190 Z" fill="#ffffff" />
  <line x1="295" y1="155" x2="296" y2="190" stroke="#ff385c" stroke-width="1.5" />
  <line x1="305" y1="155" x2="304" y2="190" stroke="#ff385c" stroke-width="1.5" />
  <path d="M 292 190 C 292 190 292 206 300 206 C 308 206 308 190 308 190 Z" fill="url(#rauschGrad)" />

  <!-- Name Pill -->
  <rect x="170" y="275" width="260" height="38" rx="19" fill="url(#rauschGrad)" />
  <text x="300" y="300" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    CHI LĂNG ARENA
  </text>

  <!-- Location Label -->
  <text x="300" y="335" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">
    HẢI CHÂU • ĐÀ NẴNG
  </text>
  <text x="300" y="352" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    SÂN CẦU LÔNG CHUYÊN NGHIỆP TRUNG TÂM
  </text>
</svg>