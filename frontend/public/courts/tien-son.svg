<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#bgGrad2)" rx="16" />

  <!-- Outer Ring with Tech notches -->
  <circle cx="300" cy="210" r="150" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="12,6" />
  <circle cx="300" cy="210" r="135" fill="#18181b" stroke="url(#primaryGrad)" stroke-width="4" />

  <!-- Tiên Sơn Iconic Flying Saucer / Stadium Architecture Lines -->
  <path d="M 210 185 Q 300 130 390 185 Q 300 165 210 185 Z" fill="url(#cyanAccent)" opacity="0.8" />
  <ellipse cx="300" cy="190" rx="95" ry="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <ellipse cx="300" cy="195" rx="80" ry="18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />

  <!-- Dynamic Flying Shuttlecock -->
  <g>
    <!-- Speed Lines -->
    <path d="M 210 270 Q 250 240 280 230" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 220 290 Q 260 260 290 245" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Shuttlecock -->
    <path d="M 285 195 L 325 185 L 320 235 L 290 240 Z" fill="#ffffff" />
    <line x1="295" y1="192" x2="298" y2="238" stroke="#ff385c" stroke-width="2" />
    <line x1="305" y1="190" x2="305" y2="236" stroke="#ff385c" stroke-width="2" />
    <line x1="315" y1="187" x2="312" y2="235" stroke="#ff385c" stroke-width="2" />
    <path d="M 290 240 C 290 240 295 260 305 260 C 315 260 320 235 320 235 Z" fill="#ff385c" />
    <circle cx="305" cy="252" r="3" fill="#ffffff" />
  </g>

  <!-- Badge Name Ribbon -->
  <rect x="150" y="295" width="300" height="42" rx="21" fill="url(#primaryGrad)" />
  <text x="300" y="322" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    TIÊN SƠN ARENA
  </text>

  <!-- Location Subtitle -->
  <text x="300" y="365" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#e4e4e7" text-anchor="middle" letter-spacing="4">
    ĐÀ NẴNG
  </text>
  <text x="300" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">
    CUNG THỂ THAO TIÊU CHUẨN QUỐC TẾ
  </text>
</svg>