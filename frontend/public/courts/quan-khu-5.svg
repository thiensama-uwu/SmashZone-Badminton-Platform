<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#e00b41" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff385c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Geometric Court Background Patterns -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="50" y="40" width="500" height="370" rx="8" />
    <line x1="300" y1="40" x2="300" y2="410" stroke-width="3" />
    <line x1="50" y1="225" x2="550" y2="225" stroke-dasharray="8,6" />
    <circle cx="300" cy="225" r="140" />
    <circle cx="300" cy="225" r="220" />
  </g>

  <!-- Central Shield Badge -->
  <g filter="url(#glow)">
    <path d="M 300 70 L 440 120 L 410 280 C 410 330 300 375 300 375 C 300 375 190 330 190 280 L 160 120 Z" 
          fill="#131d31" stroke="url(#accentGrad)" stroke-width="4" />
  </g>

  <!-- Shield Inner Border -->
  <path d="M 300 86 L 422 130 L 396 270 C 396 312 300 352 300 352 C 300 352 204 312 204 270 L 178 130 Z" 
        fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Stars Header -->
  <g fill="url(#goldGrad)">
    <polygon points="300,105 303,113 311,113 305,118 307,126 300,121 293,126 295,118 289,113 297,113" />
    <polygon points="275,110 277,117 284,117 279,121 281,128 275,124 269,128 271,121 266,117 273,117" />
    <polygon points="325,110 327,117 334,117 329,121 331,128 325,124 319,128 321,121 316,117 323,117" />
  </g>

  <!-- Crossed Badminton Rackets -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85">
    <!-- Left Racket -->
    <ellipse cx="270" cy="180" rx="25" ry="32" transform="rotate(-30 270 180)" stroke="url(#accentGrad)" stroke-width="4" fill="#0f172a" fill-opacity="0.6" />
    <line x1="270" y1="208" x2="240" y2="280" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Right Racket -->
    <ellipse cx="330" cy="180" rx="25" ry="32" transform="rotate(30 330 180)" stroke="url(#accentGrad)" stroke-width="4" fill="#0f172a" fill-opacity="0.6" />
    <line x1="330" y1="208" x2="360" y2="280" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Shuttlecock at Center -->
  <g filter="url(#glow)">
    <path d="M 282 170 L 318 170 L 310 215 L 290 215 Z" fill="#ffffff" />
    <line x1="293" y1="170" x2="296" y2="215" stroke="#ff385c" stroke-width="1.5" />
    <line x1="300" y1="170" x2="300" y2="215" stroke="#ff385c" stroke-width="1.5" />
    <line x1="307" y1="170" x2="304" y2="215" stroke="#ff385c" stroke-width="1.5" />
    <path d="M 290 215 C 290 215 290 236 300 236 C 310 236 310 215 310 215 Z" fill="#ff385c" />
    <circle cx="300" cy="226" r="3" fill="#ffffff" />
  </g>

  <!-- Court Name Banner -->
  <rect x="180" y="275" width="240" height="34" rx="17" fill="url(#accentGrad)" />
  <text x="300" y="297" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    QUÂN KHU 5
  </text>

  <!-- Location Label -->
  <text x="300" y="330" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    ĐÀ NẴNG
  </text>
  <text x="300" y="348" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">
    BADMINTON ARENA • TIÊU CHUẨN QUỐC GIA
  </text>
</svg>