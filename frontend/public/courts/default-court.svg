<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="defaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="rausch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#e00b41" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#defaultBg)" rx="16" />

  <!-- Court Outline -->
  <rect x="70" y="50" width="460" height="350" rx="12" fill="none" stroke="#27272a" stroke-width="3" />
  <rect x="90" y="70" width="420" height="310" rx="8" fill="none" stroke="#ff385c" stroke-opacity="0.25" stroke-width="2" />
  <line x1="300" y1="70" x2="300" y2="380" stroke="#ff385c" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="90" y1="225" x2="510" y2="225" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Center Circle & Shuttlecock Badge -->
  <circle cx="300" cy="210" r="70" fill="#27272a" stroke="url(#rausch)" stroke-width="3" />
  
  <!-- Modern Shuttlecock -->
  <path d="M 284 180 L 316 180 L 310 220 L 290 220 Z" fill="#ffffff" />
  <line x1="294" y1="180" x2="296" y2="220" stroke="#ff385c" stroke-width="1.5" />
  <line x1="300" y1="180" x2="300" y2="220" stroke="#ff385c" stroke-width="1.5" />
  <line x1="306" y1="180" x2="304" y2="220" stroke="#ff385c" stroke-width="1.5" />
  <path d="M 290 220 C 290 220 290 238 300 238 C 310 238 310 220 310 220 Z" fill="url(#rausch)" />

  <!-- Label Badge -->
  <rect x="170" y="300" width="260" height="38" rx="19" fill="url(#rausch)" />
  <text x="300" y="324" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    SÂN CẦU LÔNG ĐÀ NẴNG
  </text>
  <text x="300" y="360" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">
    HỆ THỐNG SÂN TIÊU CHUẨN THI ĐẤU
  </text>
</svg>