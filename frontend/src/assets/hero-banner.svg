<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonRausch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="50%" stop-color="#ff5a79" />
      <stop offset="100%" stop-color="#ff385c" />
    </linearGradient>
    <linearGradient id="glowFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff385c" stop-opacity="0.0" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff385c" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="600" fill="url(#heroDarkBg)" />

  <!-- Perspective Court Grid Lines on the Right -->
  <g opacity="0.35">
    <!-- Perspective Court Base -->
    <polygon points="500,550 1150,550 1020,250 680,250" fill="url(#glowFloor)" stroke="#ff385c" stroke-width="2" />
    <!-- Center Line -->
    <line x1="850" y1="550" x2="850" y2="250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
    <!-- Service Line -->
    <line x1="560" y1="450" x2="1110" y2="450" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Net Line -->
    <line x1="620" y1="350" x2="1060" y2="350" stroke="#ff385c" stroke-width="3" />
    <!-- Net Poles -->
    <line x1="620" y1="350" x2="620" y2="290" stroke="#ffffff" stroke-width="3" />
    <line x1="1060" y1="350" x2="1060" y2="290" stroke="#ffffff" stroke-width="3" />
    <line x1="620" y1="290" x2="1060" y2="290" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  </g>

  <!-- Dynamic Flying Shuttlecock Artwork -->
  <g filter="url(#heroGlow)">
    <!-- Light Trajectory Stream -->
    <path d="M 450 480 Q 750 120 980 200" fill="none" stroke="url(#neonRausch)" stroke-width="5" stroke-linecap="round" />
    <path d="M 480 500 Q 770 140 1000 220" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    
    <!-- Shuttlecock Vector in High Flight -->
    <g transform="translate(860, 160) rotate(25) scale(1.4)">
      <!-- Feathers -->
      <path d="M 0 0 L 50 0 L 40 45 L 10 45 Z" fill="#ffffff" />
      <line x1="12" y1="0" x2="17" y2="45" stroke="#ff385c" stroke-width="1.5" />
      <line x1="25" y1="0" x2="25" y2="45" stroke="#ff385c" stroke-width="1.5" />
      <line x1="38" y1="0" x2="33" y2="45" stroke="#ff385c" stroke-width="1.5" />
      <rect x="6" y="22" width="38" height="3" fill="#ff385c" />
      <!-- Cork Base -->
      <path d="M 10 45 C 10 45 10 65 25 65 C 40 65 40 45 40 45 Z" fill="#ff385c" />
      <circle cx="25" cy="54" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="950" cy="220" r="160" fill="none" stroke="#ff385c" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10,6" />
  <circle cx="950" cy="220" r="240" fill="none" stroke="#ff385c" stroke-opacity="0.05" stroke-width="1.5" />
</svg>